<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battlerun</title>
  <meta name="description" content="Get Battlerun news and playtest invites.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Battlerun</h1>
    <p>Thanks for playing! Get news and playtest invites.</p>

    <form id="signup" novalidate>
      <label for="email" class="visually-hidden">Email address</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
             placeholder="you@example.com" required maxlength="254">
      <!-- Honeypot: hidden from humans and screen readers -->
      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <input type="hidden" name="source">
      <button type="submit">Sign up</button>
      <!-- Must match CONSENT_TEXT in apps-script/Code.gs word for word -->
      <p class="consent">Get Battlerun news and playtest invites by email. Unsubscribe anytime.
        You must be 13 or older. <a href="privacy.html">Privacy</a></p>
    </form>
    <p id="status" role="status" aria-live="polite"></p>

    <a id="discord" class="discord" href="#" hidden rel="noopener">Join our Discord</a>
  </main>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
